name: Acessibilidade e screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - "Apostila-Roblox-Studio/**"
      - ".github/workflows/accessibility.yml"

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apostila-Roblox-Studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apostila-Roblox-Studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-acessibilidade
          path: |
            Apostila-Roblox-Studio/reports/playwright
            Apostila-Roblox-Studio/reports/screenshots
          if-no-files-found: error
